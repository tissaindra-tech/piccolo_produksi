<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7B733" />
    <title>Piccolo Corner — Pencatatan Produksi</title>
    <link rel="icon" href="/icons/favicon-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Piccolo" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
    <style>* { margin:0; padding:0; box-sizing:border-box; } body { background:#E8DCC8; font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      h2 { letter-spacing:-0.2px; }
      /* Yang di-scroll adalah #root, bukan jendela browser. Jendela (html/body) dikunci setinggi layar dan tidak bisa
         di-scroll, sehingga efek "mantul" Safari iPhone dan pergeseran layar setelah keyboard ditutup tidak bisa lagi
         mengangkat menu bawah (position:fixed) dan memperlihatkan area kosong di bawahnya. */
      html, body { height:100%; overflow:hidden; overscroll-behavior:none; }
      #root { height:100%; overflow-y:auto; overflow-x:hidden; overflow-x:clip; overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch; background:#E8DCC8; }
      /* Di HP kolom aplikasi selebar layar: latar #root disamakan dengan latar isi supaya kalau tetap ada sedikit mantul, warnanya sama (tidak ada "area kosong") */
      @media (max-width:520px) { #root { background:#F3EDE2; } }
      /* Elemen setinggi layar (login, pembungkus aplikasi): 100% dari #root yang tingginya sudah pasti */
      .layar-penuh { min-height:100%; }
      /* iPhone otomatis zoom saat mengetik di kolom yang hurufnya < 16px, dan sering tidak kembali normal.
         Khusus iPhone/iPad (Android tidak zoom): kolom isian minimal 16px. */
      @supports (-webkit-touch-callout: none) { input, select, textarea { font-size:16px !important; } }
      /* Kolom tanggal di iPhone punya lebar bawaan sendiri dan meluber keluar layar; paksa ikut lebar kolomnya */
      input[type="date"] { display:block; min-width:0; max-width:100%; -webkit-appearance:none; appearance:none; text-align:left; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
